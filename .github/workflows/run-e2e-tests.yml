name: Run end-to-end tests

permissions:
  contents: read

# On demand only. The suite stands up a PostgreSQL container and runs two
# legs against it, so it is triggered manually rather than on every push and
# pull request.
on:
  workflow_dispatch:

jobs:
  run-e2e-tests:
    name: End-to-end tests against PostgreSQL in Docker
    # Docker with the Compose plugin is preinstalled on the Ubuntu runners only.
    runs-on: ubuntu-latest
    # Two legs: the standalone CLI, then the same suite via the sdkck host CLI.
    timeout-minutes: 50
    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 2
          # Nothing here pushes; don't leave the token in .git/config for the
          # `npm ci` and build steps, which run repository code.
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          cache: npm
          node-version-file: '.nvmrc'

      - name: Install dependencies
        run: npm ci

      # The steps below are what `npm run test:e2e` does locally, split out so
      # the container is still around to dump logs from when a test fails.
      - name: Start PostgreSQL
        run: npm run e2e:up

      - name: Build the CLI
        run: npm run build

      # Step-level timeouts, not just the job's: a hung standalone run fails
      # only its own step, so the sdkck leg (which runs unless cancelled) still
      # gets its turn. The job-level timeout stays as the outer backstop.
      - name: Run end-to-end tests
        timeout-minutes: 20
        run: npm run e2e:mocha

      # Second leg: the same suite through the latest sdkck host CLI with this
      # build packed and installed as its @hesed/psql plugin — covering the
      # `prepack` artifacts (oclif.manifest.json, README) and plugin dispatch
      # under a host. The plugin is installed before any `sdkck psql` call so
      # sdkck's first-use auto-installer cannot fetch the published release
      # over this build. The throwaway sdkck home (mktemp -d) keeps the
      # install, config and caches out of the runner's real sdkck setup; the
      # test side finds it via E2E_SDKCK_HOME.
      - name: Install the latest sdkck and the packed plugin
        id: sdkck
        if: ${{ !cancelled() }}
        timeout-minutes: 5
        run: |
          npm install --no-save sdkck
          home="$(mktemp -d)"
          echo "E2E_SDKCK_HOME=$home" >> "$GITHUB_ENV"
          export SDKCK_CACHE_DIR="$home/cache" SDKCK_CONFIG_DIR="$home/config" SDKCK_DATA_DIR="$home/data"
          # A fresh home cannot hold the plugin yet; if it does, the leg would
          # test whatever is there rather than this build. `plugins inspect` is
          # a host command, so the probe cannot itself trigger sdkck's
          # first-use install.
          if ./node_modules/.bin/sdkck plugins inspect @hesed/psql --json >/dev/null 2>&1; then
            echo "error: @hesed/psql is already installed in the throwaway sdkck home" >&2
            exit 1
          fi
          # A `file:` URL is required: sdkck resolves any bare path containing
          # a slash as a GitHub org/repo. Packing into the throwaway home
          # keeps the tarball out of the workspace.
          tgz="$(npm pack --pack-destination "$home" | tail -n 1)"
          ./node_modules/.bin/sdkck plugins install "file:$home/$tgz"
          # Prove dispatch resolves to the tarball this run packed, not a
          # published release the auto-installer could have fetched: the
          # install record sdkck writes under the data dir must carry our
          # file: URL. The record is read from disk rather than via
          # `sdkck plugins inspect`, which has been observed to die on an
          # unsettled top-level await right after loading a freshly
          # installed plugin.
          grep -Fq "\"file:$home/$tgz\"" "$SDKCK_DATA_DIR/package.json"

      # Only after a verified install: otherwise sdkck's first-use installer
      # would fetch the published release and the leg would test that instead.
      - name: Run end-to-end tests via sdkck
        if: ${{ !cancelled() && steps.sdkck.outcome == 'success' }}
        timeout-minutes: 20
        run: npm run e2e:mocha
        env:
          E2E_HOST_CLI: sdkck
          E2E_SDKCK_HOME: ${{ env.E2E_SDKCK_HOME }}

      - name: Dump PostgreSQL container logs
        if: failure()
        run: docker compose -f docker/compose.yaml logs postgres

      - name: Stop PostgreSQL
        if: always()
        run: npm run e2e:down

  # Gating job for branch protection.
  e2e-test-success:
    name: '[Required] End-to-end tests passed'
    runs-on: ubuntu-latest
    needs: run-e2e-tests
    if: ${{ !cancelled() }}
    steps:
      - if: ${{ needs.run-e2e-tests.result != 'success' }}
        run: 'exit 1'
      - run: 'exit 0'
